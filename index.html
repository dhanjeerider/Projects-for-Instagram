<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Projects - Navigation Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .project-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .project-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .project-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .project-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            margin-top: auto;
        }

        .project-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .stats p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .projects-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const projectsGrid = document.getElementById('projectsGrid');
        const searchInput = document.getElementById('searchInput');
        const displayCount = document.getElementById('displayCount');

        function renderProjects(filteredProjects) {
            projectsGrid.innerHTML = '';
            
            if (filteredProjects.length === 0) {
                projectsGrid.innerHTML = '<div class="no-results">No projects found</div>';
                displayCount.textContent = '0';
                return;
            }

            filteredProjects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-number">Project #${project.number}</div>
                    <div class="project-content">
                        <div class="project-title">${project.name}</div>
                        <a href="${encodeURI(project.folder)}/index.html" class="project-link">View Project →</a>
                    </div>
                `;
                projectsGrid.appendChild(card);
            });

            displayCount.textContent = filteredProjects.length;
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = projects.filter(project =>
                project.name.toLowerCase().includes(searchTerm) ||
                project.number.toString().includes(searchTerm)
            );
            renderProjects(filtered);
        });

        // Initial render
        renderProjects(projects);
    </script>
